name: Tax_calculator_ci_cd_eks

on:
#push
  workflow_dispatch

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [service-a, service-b]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup JDk
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
      - name: Build and test maven
        working-directory: docker/app2-tax-calculator/spring/${{ matrix.service }}
        run: mvn -B clean verify

  docker-build-login:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        service:
          - { name: "service-a", docker_name: "tax-service-a", path: "docker/app2-tax-calculator/spring/service-a" }
          - { name: "service-b", docker_name: "tax-service-b", path: "docker/app2-tax-calculator/spring/service-b" }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDk
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Build JAR for Docker
        working-directory: ${{ matrix.service.path }}
        run: mvn -B clean package -DskipTests

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.docker_name }}:latest

  running-service-on-eks:
    runs-on: ubuntu-latest
    needs: docker-build-login
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Update kubeconfig for EKS cluster
        run: |
          aws eks update-kubeconfig --name tax-calculator-cluster --region us-east-1
      - name: Deploy to EKS using kubectl
        run: |
          kubectl apply -f docker/app2-tax-calculator/k8s/deployment.yaml
          kubectl apply -f docker/app2-tax-calculator/k8s/service.yaml